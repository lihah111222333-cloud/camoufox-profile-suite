# Publish the same verified npm tarball as a Release asset and to GitHub Packages.
# Follow the README release preflight before pushing a tag or publishing in the UI.
name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@code-root'

      - name: Verify the release tag and source files
        id: tag
        shell: bash
        run: |
          event_commit=$(git rev-parse --verify --end-of-options "${GITHUB_SHA}^{commit}")
          checkout_commit=$(git rev-parse --verify HEAD)
          if [[ "$event_commit" != "$checkout_commit" ]]; then
            echo 'The checked-out tag no longer matches the release event.' >&2
            exit 1
          fi
          node scripts/check-distribution.mjs tag "$GITHUB_REF_NAME" "$event_commit" > /dev/null
          printf 'commit=%s\n' "$event_commit" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Security tests
        run: npm run test:security

      - name: Pack and verify the archive
        id: pack
        shell: bash
        run: |
          TGZ=$(npm pack --json | node scripts/check-distribution.mjs archive)
          printf 'package=%s\n' "$TGZ" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ steps.tag.outputs.commit }}
          files: ${{ steps.pack.outputs.package }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish "./$PACKAGE_ARCHIVE"
        env:
          PACKAGE_ARCHIVE: ${{ steps.pack.outputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
